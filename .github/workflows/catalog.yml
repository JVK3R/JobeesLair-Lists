name: catalog

# Rebuilds ps5/live.jlx, the live catalog Jobee'sLair reads at launch, every three hours. The builder is
# tools/catalog/live-feed.mjs in github.com/JVK3R/JobeesLair, checked out beside this repository; its records
# (ps5/names.jlx, ratings.json, first-seen.json, art.json) are kept here, and what changed is committed here.
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JL_LISTS_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JVK3R/JobeesLair
          path: builder
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The store ratings first (new games, and a slice of the stale ones), so the catalog carries them.
      - name: Refresh the store ratings
        run: node builder/tools/catalog/ratings.mjs
      - name: Build the live catalog
        run: node builder/tools/catalog/live-feed.mjs
      - name: Commit what changed
        run: |
          if [ -z "$(git status --porcelain -- ps5/)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ps5/
          git commit -m "ps5: refresh"
          git pull --rebase origin main
          git push
